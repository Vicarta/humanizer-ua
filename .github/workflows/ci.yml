name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate skill
        run: python3 scripts/lint_skill.py
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
      - name: Build release ZIP
        run: python3 scripts/build_release_zip.py
      - name: Smoke-test installed package
        run: python3 scripts/install_smoke.py --zip dist/humanizer-ua.zip

